---
type: specs.openrewrite.org/v1beta/recipe
name: io.kroxylicious.migrations.v0_24.UseKroxyliciousKafkaTypes
displayName: Use Kroxylicious-managed Kafka API types
description: Replaces org.apache.kafka generated message packages with io.kroxylicious.kafka.
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.kafka.common.message
      newPackageName: io.kroxylicious.kafka.common.message
      recursive: true
  - org.openrewrite.java.ChangePackageInStringLiteral:
      oldPackageName: org.apache.kafka.common.message
      newPackageName: io.kroxylicious.kafka.common.message
  - org.openrewrite.java.ChangePackage:
        oldPackageName: org.apache.kafka.common.protocol
        newPackageName: io.kroxylicious.kafka.common.protocol
        recursive: true
  - org.openrewrite.java.ChangePackageInStringLiteral:
      oldPackageName: org.apache.kafka.common.protocol
      newPackageName: io.kroxylicious.kafka.common.protocol

