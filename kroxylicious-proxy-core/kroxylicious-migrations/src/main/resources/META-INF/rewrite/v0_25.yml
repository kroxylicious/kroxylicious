type: specs.openrewrite.org/v1beta/recipe
name: io.kroxylicious.migrations.rewrite.v0_25.MigrateTo0_25
displayName: Upgrade Kroxylicious to 0.25.0
description: Applies all deprecations, renames, and breaking changes introduced in Kroxylicious 0.25.0.
recipeList:
  # Unlike the other recipes, this one rewrites proxy configuration YAML rather than Java sources. It considers every
  # YAML file it is given, and migrates those that structurally look like a proxy configuration. Run it on its own,
  # passing the filePattern option, if you would rather narrow that down.
  - io.kroxylicious.migrations.rewrite.v0_25.UseClusterDefinitions
  - io.kroxylicious.migrations.rewrite.v0_25.UseKroxylicious0_25
