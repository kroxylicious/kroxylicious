image.substitutor=io.kroxylicious.testing.integration.MirrorImageNameSubstitutor

# Registries on the MirrorImageNameSubstitutor allow-list (e.g. quay.io) are pulled directly, without
# a mirror to fall back on. The default 120s pull retry window is too short to ride out transient
# registry outages in CI (https://github.com/kroxylicious/kroxylicious/issues/4458), so allow
# testcontainers to keep retrying the pull for up to 10 minutes.
pull.timeout=600