# .github/actionlint.yaml
self-hosted-runner:
  # Runner labels that are valid but not yet in actionlint's built-in list of
  # GitHub-hosted runners. Remove entries once actionlint recognises them.
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - SC2086
      # $/ is GitHub's self-repository syntax (preferred over ./ by zizmor's self-checkout audit)
      # but actionlint does not recognise it yet.
      - 'reusable workflow call "\$/\.'
      - 'specifying action "\$/\..*" in invalid format because ref is missing'
