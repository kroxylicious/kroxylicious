name: Lint GitHub Actions workflows
on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/actionlint.yaml
      - .github/zizmor.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: actionlint
        id: actionLint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: ".github/workflows/*.yml, .github/workflows/*.yaml"
          # .github/actions/**/*.yml shall be excluded as they are composite and not jobs.

  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reports all findings to code scanning (does not fail the job)
      - name: Report findings to code scanning
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

      # Fails the job on medium and higher findings
      - name: Check for medium and higher findings
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: medium
