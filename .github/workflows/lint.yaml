name: "Lint Pull Request"

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: 'Test for Slack secret'
        if: github.event_name != 'merge_group'
        env:
          KROXYLICIOUS_SLACK_WEBHOOK: ${{ secrets.KROXYLICIOUS_SLACK_WEBHOOK }}
        run: |
          echo "SLACK_WEBHOOK_SET=$(test ${KROXYLICIOUS_SLACK_WEBHOOK} && echo true)" >> $GITHUB_ENV
      - name: 'Check out repository'
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 'Test release documentation scripts'
        if: github.event_name != 'merge_group'
        run: |
          bash -n scripts/stage-docs.sh scripts/update-latest-docs-release.sh scripts/update-latest-docs-release-test.sh
          shellcheck scripts/stage-docs.sh scripts/update-latest-docs-release.sh scripts/update-latest-docs-release-test.sh
          ./scripts/update-latest-docs-release-test.sh
      - name: Setup Java
        if: github.event_name != 'merge_group'
        uses: $/.github/actions/common/setup-java
      - name: 'Cache Maven packages'
        if: github.event_name != 'merge_group'
        uses: $/.github/actions/common/cache-maven-packages
      - name: 'Compile and lint the project'
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This is the authoritative QA check for all PRs. Explicitly enable the qa profile.
          # ErrorProne automatically activates on JDK 17+ (errorprone-jdk-compatible profile).
          # All quality checks run: formatting, licensing, checkstyle, spotbugs, dependency analysis, enforcer, errorprone.
          # Other workflows skip QA to avoid duplication.
          # Run japicmp here so API compatibility breaks are caught on PRs, not just in the merge queue.
          # Skip it only when the reference release is not yet published (nothing to compare against).
          REFERENCE_RELEASE=$(mvn --batch-mode --quiet -pl kroxylicious-api help:evaluate -Dexpression=ApiCompatability.ReferenceVersion -DforceStdout)
          REFERENCE_RELEASE_UNPUBLISHED=$(mvn --batch-mode --quiet dependency:get -Dartifact=io.kroxylicious:kroxylicious-parent:${REFERENCE_RELEASE}:pom 1>/dev/null && echo false || echo true)
          mvn --batch-mode \
            --activate-profiles build-the-world,ci,qa \
            --threads 1.5C \
            -DskipTests \
            -Djapicmp.skip=${REFERENCE_RELEASE_UNPUBLISHED} \
            verify
      - name: 'Validate POM metadata for Central Portal'
        if: github.event_name != 'merge_group'
        run: |
          mvn --batch-mode --quiet help:effective-pom -Doutput=target/effective-pom.xml
          mvn --batch-mode --quiet --projects kroxylicious-bom help:effective-pom -Doutput=target/effective-pom.xml
          # +1 for the root reactor pom, which appears in the effective-pom but is not declared as a <module> anywhere
          expected=$(( $(grep -h -r --include="pom.xml" "<module>" . | grep -v target | sort | uniq | wc -l) + 1 ))
          python3 scripts/validate_pom_metadata.py target/effective-pom.xml "$expected"
          python3 scripts/validate_pom_metadata.py kroxylicious-bom/target/effective-pom.xml
      - name: 'Validate JAR manifest entries'
        if: github.event_name != 'merge_group'
        run: |
          KROXYLICIOUS_VERSION="$(mvn --batch-mode --quiet help:evaluate -Dexpression=project.version -DforceStdout)"
          KROXYLICIOUS_API_FINAL_NAME="$(mvn --batch-mode --quiet --projects kroxylicious-api help:evaluate -Dexpression=project.build.finalName -DforceStdout)"
          python3 scripts/validate_jar_manifests.py \
            "kroxylicious-api/target/${KROXYLICIOUS_API_FINAL_NAME}.jar" \
            --expected-version="$KROXYLICIOUS_VERSION" \
            --expected-title="Kroxylicious API" \
            --expected-vendor="Kroxylicious"
      - name: 'Install xmllint'
        if: github.event_name != 'merge_group'
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: 'Validate module-profile structure'
        if: github.event_name != 'merge_group'
        run: bash scripts/validate-module-structure.sh
      - name: Save PR number to file
        if: github.event_name != 'merge_group'
        run: echo ${{ github.event.number }} > PR_NUMBER.txt
      - name: Archive PR number
        if: github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PR_NUMBER
          path: PR_NUMBER.txt
          if-no-files-found: error
