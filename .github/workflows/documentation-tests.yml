name: Documentation Tests

on:
  workflow_call:

jobs:
  documentation_tests:
    runs-on: ubuntu-latest

    steps:
      # StepSecurity harden-runner cannot be used here because of the limitation of running it on containers (minikube)
      # https://github.com/step-security/harden-runner/blob/main/docs/limitations.md
      - name: 'Check out repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: $/.github/actions/common/setup-java
      - name: Setup Minikube
        uses: $/.github/actions/common/setup-minikube
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Cache Maven packages'
        uses: $/.github/actions/common/cache-maven-packages
      - name: 'Download Kroxylicious Maven artifacts'
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
        with:
          name: kroxylicious-maven-artifacts
          path: /tmp/kroxylicious-artifacts
          run_id: ${{ github.run_id }}
      - name: 'Download Kroxylicious proxy container artifact'
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
        with:
          name: kroxylicious-proxy
          run_id: ${{ github.run_id }}
      - name: 'Download Kroxylicious operator container artifact'
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
        with:
          name: kroxylicious-operator
          run_id: ${{ github.run_id }}
      - name: 'Extract Kroxylicious Maven artifacts'
        run: |
          mkdir -p "$HOME/.m2/repository"
          cd "$HOME/.m2/repository"
          tar xzf /tmp/kroxylicious-artifacts/maven-repo.tar.gz
      - name: 'Place container images at paths expected by QuickStartDT'
        run: |
          # QuickStartDT resolves images relative to the repo root (Utils.java:35-36).
          # QuickStartDT loads these into the throw-away Minikube profile it creates per quick
          # start run, so there is no `minikube image load` step in this workflow.
          mkdir -p kroxylicious-app/target
          mv kroxylicious-proxy.img.tar.gz kroxylicious-app/target/
          mkdir -p kroxylicious-kubernetes/kroxylicious-operator/target
          mv kroxylicious-operator.img.tar.gz kroxylicious-kubernetes/kroxylicious-operator/target/
      - name: 'Extract Strimzi version'
        id: strimzi
        run: |
          STRIMZI_VERSION=$(grep -m1 '^:strimzi-version:' kroxylicious-docs/docs/record-encryption-quick-start/index.adoc | awk '{print $2}')
          echo "version=${STRIMZI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Strimzi version: ${STRIMZI_VERSION}"
      - name: 'Cache Strimzi manifest'
        id: strimzi-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/strimzi-manifest
          key: strimzi-manifest-${{ steps.strimzi.outputs.version }}
      - name: 'Download Strimzi manifest'
        if: steps.strimzi-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRIMZI_VERSION: ${{ steps.strimzi.outputs.version }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -o /tmp/strimzi-manifest/kafka-single-node.yaml \
            --create-dirs \
            "https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/refs/tags/${STRIMZI_VERSION}/examples/kafka/kafka-single-node.yaml"
      - name: 'Run documentation tests'
        env:
          STRIMZI_MANIFEST: /tmp/strimzi-manifest/kafka-single-node.yaml
        run: |
          mvn -Djapicmp.skip=true -DskipUTs=true -DskipITs=true -DskipKTs=true -DskipDTs=false \
            -Derrorprone.skip=true --batch-mode verify --activate-profiles 'dist,!qa' \
            --projects ':kroxylicious-docs-tests'
