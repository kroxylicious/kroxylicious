name: Sonar Scan

on:
  workflow_run:
    workflows: [ "Lint Pull Request" ]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  Sonar:
    runs-on: ubuntu-latest
    if: github.event.workflow_run && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'merge_group')
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 'Test for Sonar secret'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "SONAR_TOKEN_SET=$(test ${SONAR_TOKEN} && echo true)" >> $GITHUB_ENV
      - name: Mark SonarCloud checks as succeeded for merge queue
        # Merge queue items trust the scan already run against the PR branch; a
        # queue merge commit gets no PR to decorate, so skip the real scan and
        # satisfy the two required checks directly via the Checks API.
        if: github.event.workflow_run.event == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for NAME in "[Proxy Runtime] SonarCloud Code Analysis" "[Kroxylicious Operator] SonarCloud Code Analysis"; do
            gh api "repos/${{ github.repository }}/check-runs" \
              -f name="$NAME" -f head_sha="$SHA" -f status=completed -f conclusion=success
          done
      - name: Download PR number artifact
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: PR_NUMBER
      - name: Read PR_NUMBER.txt
        id: pr_number
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
        with:
          path: ./PR_NUMBER.txt
      - name: Request GitHub API for PR data
        uses: octokit/request-action@b66ca9cd744693e9c29b490fc08831ab66c4a970
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
        id: get_pr_data
        with:
          route: GET /repos/${{env.full_name}}/pulls/${{env.pr_number}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ steps.pr_number.outputs.content }}
          full_name: ${{ github.event.repository.full_name }}
      - name: "Check for legal branch names"
        id: set_branch_name
        if: github.event.workflow_run.event != 'merge_group'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ ${HEAD_BRANCH} =~ [\(\$\)\;]+ ]];
          then
            echo "BRANCH '${HEAD_BRANCH}' contains potentially malicious characters as it matches BRANCH_REGEX '${BRANCH_REGEX}'"
            exit 1
          else
            echo "SANITIZED_HEAD_REF=${HEAD_BRANCH}" >> $GITHUB_ENV
          fi
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{env.SANITIZED_HEAD_REF}}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
      - name: Checkout base branch
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
        run: |
          git remote add upstream ${{ github.event.repository.clone_url }}
          git fetch upstream
          git checkout -B ${{ fromJson(steps.get_pr_data.outputs.data).base.ref }} upstream/${{ fromJson(steps.get_pr_data.outputs.data).base.ref }}
          git checkout "origin/${{env.SANITIZED_HEAD_REF}}"
          git clean -ffdx && git reset --hard HEAD
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
      - name: Setup Java
        uses: $/.github/actions/common/setup-java
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
      - name: 'Cache Maven packages'
        if: github.event.workflow_run.event != 'merge_group'
        uses: $/.github/actions/common/cache-maven-packages
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Preinstall prior to SonarCloud scan
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group'
        run: |
          mvn --batch-mode \
            --activate-profiles 'ci,!qa' \
            -Derrorprone.skip=true \
            -DskipITs=true \
            -DskipTests \
            install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SonarCloud scan on PR for the Proxy Core
        id: proxy_scan
        continue-on-error: true
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group' && hashFiles('scripts/ci-build-functions.sh') != ''
        run: |
          source scripts/ci-build-functions.sh
          run_sonar "${PROXY_PROFILES}" 'Proxy Runtime' 'kroxylicious_kroxylicious' \
            -Djapicmp.skip=true \
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }} \
            -Dsonar.pullrequest.key=${{ fromJson(steps.get_pr_data.outputs.data).number }} \
            -Dsonar.pullrequest.branch=${{ fromJson(steps.get_pr_data.outputs.data).head.ref }} \
            -Dsonar.pullrequest.base=${{ fromJson(steps.get_pr_data.outputs.data).base.ref }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SonarCloud scan on PR for the Proxy Core (legacy release branches)
        id: proxy_scan_legacy
        continue-on-error: true
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group' && hashFiles('scripts/ci-build-functions.sh') == ''
        run: |
          # Old release branches: profile-based build not available; exclude operator modules instead
          mvn --batch-mode \
            --activate-profiles 'ci,!qa' \
            --projects '!:kroxylicious-operator,!:kroxylicious-kubernetes-api,!:kroxylicious-operator-test-support' \
            -Derrorprone.skip=true \
            -DskipITs=true \
            -Djapicmp.skip=true \
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }} \
            -Dsonar.pullrequest.key=${{ fromJson(steps.get_pr_data.outputs.data).number }} \
            -Dsonar.pullrequest.branch=${{ fromJson(steps.get_pr_data.outputs.data).head.ref }} \
            -Dsonar.pullrequest.base=${{ fromJson(steps.get_pr_data.outputs.data).base.ref }} \
            verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SonarCloud scan on PR for the Operator
        id: operator_scan
        continue-on-error: true
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group' && hashFiles('scripts/ci-build-functions.sh') != ''
        run: |
          source scripts/ci-build-functions.sh
          if [ -f "kroxylicious-kubernetes/pom.xml" ]; then
            run_sonar "${KUBERNETES_PROFILES}" 'Kroxylicious Operator' 'kroxylicious_operator' \
              -Djapicmp.skip=true \
              -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }} \
              -Dsonar.pullrequest.key=${{ fromJson(steps.get_pr_data.outputs.data).number }} \
              -Dsonar.pullrequest.branch=${{ fromJson(steps.get_pr_data.outputs.data).head.ref }} \
              -Dsonar.pullrequest.base=${{ fromJson(steps.get_pr_data.outputs.data).base.ref }}
          else
            # Old release branches: operator was not under kroxylicious-kubernetes/
            mvn --batch-mode \
              --activate-profiles 'ci,!qa' \
              --projects ':kroxylicious-operator,:kroxylicious-parent' \
              -Derrorprone.skip=true \
              -DskipITs=true \
              -Djapicmp.skip=true \
              -Dsonar.projectName='Kroxylicious Operator' \
              -Dsonar.projectKey='kroxylicious_operator' \
              -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }} \
              -Dsonar.pullrequest.key=${{ fromJson(steps.get_pr_data.outputs.data).number }} \
              -Dsonar.pullrequest.branch=${{ fromJson(steps.get_pr_data.outputs.data).head.ref }} \
              -Dsonar.pullrequest.base=${{ fromJson(steps.get_pr_data.outputs.data).base.ref }} \
              verify \
              org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          fi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SonarCloud scan on PR for the Operator (legacy release branches)
        id: operator_scan_legacy
        continue-on-error: true
        if: env.SONAR_TOKEN_SET == 'true' && github.event.workflow_run.event != 'merge_group' && hashFiles('scripts/ci-build-functions.sh') == ''
        run: |
          # Old release branches: profile-based build not available
          PROJECTS=':kroxylicious-operator,:kroxylicious-parent'
          if [ -f "kroxylicious-kubernetes/pom.xml" ]; then
            PROJECTS=":kroxylicious-operator,:kroxylicious-operator-test-support,:kroxylicious-kubernetes-parent,:kroxylicious-parent"
          fi
          mvn --batch-mode \
            --activate-profiles 'ci,!qa' \
            --projects "$PROJECTS" \
            -Derrorprone.skip=true \
            -DskipITs=true \
            -Djapicmp.skip=true \
            -Dsonar.projectName='Kroxylicious Operator' \
            -Dsonar.projectKey='kroxylicious_operator' \
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }} \
            -Dsonar.pullrequest.key=${{ fromJson(steps.get_pr_data.outputs.data).number }} \
            -Dsonar.pullrequest.branch=${{ fromJson(steps.get_pr_data.outputs.data).head.ref }} \
            -Dsonar.pullrequest.base=${{ fromJson(steps.get_pr_data.outputs.data).base.ref }} \
            verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Post failed Proxy Core SonarCloud check
        if: steps.proxy_scan.outcome == 'failure' || steps.proxy_scan_legacy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name="[Proxy Runtime] SonarCloud Code Analysis" \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion=failure \
            -f "output[title]=SonarCloud Proxy Core scan failed" \
            -f "output[summary]=The SonarCloud Proxy Core scan encountered an error. Re-run the [Sonar workflow job](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to retry."
      - name: Post failed Operator SonarCloud check
        if: steps.operator_scan.outcome == 'failure' || steps.operator_scan_legacy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api "repos/${{ github.repository }}/check-runs" \
            -f name="[Kroxylicious Operator] SonarCloud Code Analysis" \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion=failure \
            -f "output[title]=SonarCloud Operator scan failed" \
            -f "output[summary]=The SonarCloud Operator scan encountered an error. Re-run the [Sonar workflow job](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to retry."
      - name: Fail job if any SonarCloud scan failed
        if: steps.proxy_scan.outcome == 'failure' || steps.proxy_scan_legacy.outcome == 'failure' || steps.operator_scan.outcome == 'failure' || steps.operator_scan_legacy.outcome == 'failure'
        run: exit 1
