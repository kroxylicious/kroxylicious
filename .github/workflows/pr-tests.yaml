name: Run Pull-Requests Tests

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    branches:
      - "main"
      - 'release/**'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_artifacts:
    uses: $/.github/workflows/build-kroxylicious-artifacts.yaml

  integration_test_pr:
    needs: build_artifacts
    uses: $/.github/workflows/integration-tests.yaml

  system_tests_pr:
    needs: build_artifacts
    uses: $/.github/workflows/system-tests-pr.yaml

  pr_test_gate:
    runs-on: ubuntu-latest
    name: All Checks Passed
    needs: [ integration_test_pr, system_tests_pr ]
    if: always()
    permissions:
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: 'Evaluate Dependencies'
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more prerequisite checks failed or were cancelled."
            exit 1
          fi
          echo "All checks passed successfully."
