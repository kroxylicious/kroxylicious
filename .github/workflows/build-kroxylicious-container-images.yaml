#
# build-kroxylicious-container-images.yaml — the single canonical place for building
# Kroxylicious container images.
#
# Multi-arch proxy images are built as a 5-phase process:
#   1. mvn install  — compile and install all module JARs into ~/.m2 once
#   2. mvn + docker — dist packaging and image build for linux/amd64
#   3. mvn + docker — dist packaging (with -Paarch64) and image build for linux/arm64
#   4. mvn + docker — dist packaging (with -Pppc64le / -Ps390x) on the x86 runner, then
#                     image build on native IBM Power (ppc64le) and Z (s390x) runners
#   5. manifest     — merge per-arch images into a multi-arch manifest list
#
# The IBM Power and Z runners (https://github.com/IBM/actionspz) are only available to
# the kroxylicious/kroxylicious repository, not to forks, so phase 4 is skipped elsewhere.
# Netty publishes no native transports for ppc64le or s390x, so those images use NIO.
#
# The operator and admission webhook have no architecture-specific native JARs,
# so a single multi-arch Docker Buildx build (using QEMU) covers all platforms.
#
# Callers:
#   - maven.yaml          — CI validation (PR) and snapshot image pushes (main/release branches)
#   - build-kroxylicious-artifacts.yaml — produce tarballs for system tests
#   - stage_release.yaml  — dispatch on release branch to build and push staged images
#
# Required repository variables (when push-images=true):
#   REGISTRY_SERVER       — container registry server, e.g. quay.io
#   REGISTRY_ORGANISATION — organisation/namespace within the registry
#   REGISTRY_USERNAME     — registry username or robot-account username
#   PROXY_IMAGE_NAME      — proxy image name (without tag)
#   OPERATOR_IMAGE_NAME   — operator image name (without tag)
#   ADMISSION_IMAGE_NAME  — admission webhook image name (without tag)
# Required repository secret (when push-images=true):
#   REGISTRY_TOKEN        — access token for REGISTRY_USERNAME

name: Build Kroxylicious Container Images

on:
  workflow_call:
    inputs:
      push-images:
        description: 'Push images to the container registry'
        type: boolean
        default: false
      multi-arch:
        description: 'Build linux/amd64, linux/arm64, linux/ppc64le and linux/s390x proxy images (ppc64le and s390x only within kroxylicious/kroxylicious). Operator and admission are always multi-arch when pushed.'
        type: boolean
        default: false
      additional-tags:
        description: 'Extra comma-separated image tags alongside the commit-SHA tag (e.g. "0.23.0-SNAPSHOT"). Leave empty for SHA-only.'
        type: string
        default: ''
      output-tarballs:
        description: 'Export amd64 images as Docker-format gzip tarballs and upload them as GitHub Actions artifacts for use by system tests. Mutually exclusive with push-images.'
        type: boolean
        default: false
    secrets:
      REGISTRY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      push-images:
        description: 'Push images to the container registry'
        type: boolean
        default: false
      multi-arch:
        description: 'Build linux/amd64, linux/arm64, linux/ppc64le and linux/s390x images'
        type: boolean
        default: false
      additional-tags:
        description: 'Extra comma-separated image tags alongside the commit-SHA tag (e.g. "0.23.0-SNAPSHOT"). Leave empty for SHA-only.'
        required: false
        default: ''
      output-tarballs:
        description: 'Export amd64 images as Docker-format gzip tarballs and upload them as GitHub Actions artifacts for use by system tests. Mutually exclusive with push-images.'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.build_configuration.outputs.release_version }}
      image_created: ${{ steps.build_configuration.outputs.image_created }}
      multi_arch: ${{ steps.build_configuration.outputs.multi_arch }}
      power_z: ${{ steps.build_configuration.outputs.power_z }}
      proxy_amd64_tag: ${{ steps.build_configuration.outputs.proxy_amd64_tag }}
      proxy_arm64_tag: ${{ steps.build_configuration.outputs.proxy_arm64_tag }}
      proxy_arch_tag_prefix: ${{ steps.build_configuration.outputs.proxy_arch_tag_prefix }}
      proxy_final_tags: ${{ steps.build_configuration.outputs.proxy_final_tags }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Setup Java
        uses: $/.github/actions/common/setup-java

      - name: 'Cache Maven packages'
        uses: $/.github/actions/common/cache-maven-packages

      - name: Determine Build Configuration
        id: build_configuration
        env:
          ADDITIONAL_TAGS: ${{ inputs.additional-tags }}
        run: |
          if [[ "${{ inputs.output-tarballs }}" == "true" && "${{ inputs.push-images }}" == "true" ]]; then
            echo "::error::output-tarballs and push-images are mutually exclusive; set at most one to true." >&2
            exit 1
          fi

          POMS_VERSION=$(mvn help:evaluate -Dexpression=project.version --quiet -DforceStdout)
          echo "release_version=${POMS_VERSION}" >> $GITHUB_OUTPUT
          echo "image_created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "output_tarballs=${{ inputs.output-tarballs }}" >> $GITHUB_OUTPUT
          SHA_TAG="commit-${GITHUB_SHA}"

          if [[ "${{ inputs.output-tarballs }}" == "true" ]]; then
            # Tarball mode: amd64-only, no push, use Maven image names for compatibility
            # with system-test tooling that verifies image names via Maven properties.
            echo "push_images=false" >> $GITHUB_OUTPUT
            echo "multi_arch=false" >> $GITHUB_OUTPUT
            echo "proxy_amd64_tag=quay.io/kroxylicious/proxy:${POMS_VERSION}" >> $GITHUB_OUTPUT
            echo "proxy_arm64_tag=" >> $GITHUB_OUTPUT
            echo "proxy_arch_tag_prefix=" >> $GITHUB_OUTPUT
            echo "power_z=false" >> $GITHUB_OUTPUT
            echo "proxy_final_tags=" >> $GITHUB_OUTPUT
            echo "operator_platforms=linux/amd64" >> $GITHUB_OUTPUT
            echo "operator_tags=quay.io/kroxylicious/operator:${POMS_VERSION}" >> $GITHUB_OUTPUT
            echo "admission_platforms=linux/amd64" >> $GITHUB_OUTPUT
            echo "admission_tags=quay.io/kroxylicious/webhook:${POMS_VERSION}" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.push-images }}" != "true" || "${{ vars.REGISTRY_SERVER }}" == "" ]]; then
            # No-push mode: amd64-only validation build (CI PRs or forks without registry vars).
            echo "push_images=false" >> $GITHUB_OUTPUT
            echo "multi_arch=false" >> $GITHUB_OUTPUT
            echo "proxy_amd64_tag=kroxylicious-proxy:${SHA_TAG}" >> $GITHUB_OUTPUT
            echo "proxy_arm64_tag=" >> $GITHUB_OUTPUT
            echo "proxy_arch_tag_prefix=" >> $GITHUB_OUTPUT
            echo "power_z=false" >> $GITHUB_OUTPUT
            echo "proxy_final_tags=" >> $GITHUB_OUTPUT
            echo "operator_platforms=linux/amd64" >> $GITHUB_OUTPUT
            echo "operator_tags=kroxylicious-operator:${SHA_TAG}" >> $GITHUB_OUTPUT
            echo "admission_platforms=linux/amd64" >> $GITHUB_OUTPUT
            echo "admission_tags=kroxylicious-admission:${SHA_TAG}" >> $GITHUB_OUTPUT
          else
            PROXY_IMAGE="${{ vars.REGISTRY_SERVER }}/${{ vars.REGISTRY_ORGANISATION }}/${{ vars.PROXY_IMAGE_NAME }}"
            OPERATOR_IMAGE="${{ vars.REGISTRY_SERVER }}/${{ vars.REGISTRY_ORGANISATION }}/${{ vars.OPERATOR_IMAGE_NAME }}"
            ADMISSION_IMAGE="${{ vars.REGISTRY_SERVER }}/${{ vars.REGISTRY_ORGANISATION }}/${{ vars.ADMISSION_IMAGE_NAME }}"

            # Per-arch intermediate tags are pushed individually then merged into the
            # final manifest list.
            echo "push_images=true" >> $GITHUB_OUTPUT
            echo "multi_arch=${{ inputs.multi-arch }}" >> $GITHUB_OUTPUT
            echo "proxy_amd64_tag=${PROXY_IMAGE}:${SHA_TAG}-amd64" >> $GITHUB_OUTPUT
            echo "proxy_arm64_tag=${PROXY_IMAGE}:${SHA_TAG}-arm64" >> $GITHUB_OUTPUT
            # ppc64le and s390x tags are derived from this prefix by the build-proxy-power-z job.
            echo "proxy_arch_tag_prefix=${PROXY_IMAGE}:${SHA_TAG}" >> $GITHUB_OUTPUT

            # The IBM Power and Z runners are only granted to the upstream repository.
            if [[ "${{ inputs.multi-arch }}" == "true" && "${{ github.repository }}" == "kroxylicious/kroxylicious" ]]; then
              echo "power_z=true" >> $GITHUB_OUTPUT
            else
              echo "power_z=false" >> $GITHUB_OUTPUT
            fi

            # All builds get a commit SHA tag. Callers may also pass arbitrary
            # additional-tags (e.g. maven.yaml adds the POM version on pushes
            # to main/release; staging dispatches pass none).
            TAG_SUFFIXES=("${SHA_TAG}")
            if [[ -n "${ADDITIONAL_TAGS}" ]]; then
              IFS=',' read -ra EXTRA_TAGS <<< "${ADDITIONAL_TAGS}"
              for extra_tag in "${EXTRA_TAGS[@]}"; do
                TAG_SUFFIXES+=("${extra_tag// /}")
              done
            fi

            PROXY_FINAL_TAGS=""
            OPERATOR_TAGS=""
            ADMISSION_TAGS=""
            for suffix in "${TAG_SUFFIXES[@]}"; do
              PROXY_FINAL_TAGS="${PROXY_FINAL_TAGS:+${PROXY_FINAL_TAGS},}${PROXY_IMAGE}:${suffix}"
              OPERATOR_TAGS="${OPERATOR_TAGS:+${OPERATOR_TAGS},}${OPERATOR_IMAGE}:${suffix}"
              ADMISSION_TAGS="${ADMISSION_TAGS:+${ADMISSION_TAGS},}${ADMISSION_IMAGE}:${suffix}"
            done

            echo "proxy_final_tags=${PROXY_FINAL_TAGS}" >> $GITHUB_OUTPUT
            echo "operator_platforms=linux/amd64,linux/arm64,linux/ppc64le,linux/s390x" >> $GITHUB_OUTPUT
            echo "operator_tags=${OPERATOR_TAGS}" >> $GITHUB_OUTPUT
            echo "admission_platforms=linux/amd64,linux/arm64,linux/ppc64le,linux/s390x" >> $GITHUB_OUTPUT
            echo "admission_tags=${ADMISSION_TAGS}" >> $GITHUB_OUTPUT
          fi

      # Install (not just package) so the per-arch dist steps can resolve local
      # module JARs from ~/.m2 without needing --also-make.

      - name: Compile and install all modules
        run: |
          mvn --quiet \
            --batch-mode \
            --activate-profiles 'dist,!qa' \
            --also-make \
            --projects :kroxylicious-app,:kroxylicious-operator,:kroxylicious-admission \
            -Derrorprone.skip=true \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -DskipDocs=true \
            -DskipContainerImageBuild=true \
            install

      - name: Login to container registry
        if: steps.build_configuration.outputs.push_images == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ vars.REGISTRY_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build amd64 distribution artifacts
        run: |
          mvn --quiet \
            --batch-mode \
            --activate-profiles 'dist,!qa' \
            --projects :kroxylicious-app,:kroxylicious-operator,:kroxylicious-admission \
            -Derrorprone.skip=true \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -DskipDocs=true \
            -DskipContainerImageBuild=true \
            package

      - name: Build and maybe push amd64 proxy image
        if: steps.build_configuration.outputs.output_tarballs != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./kroxylicious-app
          file: ./kroxylicious-app/src/main/docker/proxy.dockerfile
          platforms: linux/amd64
          push: ${{ steps.build_configuration.outputs.push_images == 'true' }}
          build-args: |
            KROXYLICIOUS_VERSION=${{ steps.build_configuration.outputs.release_version }}
          labels: |
            org.opencontainers.image.created=${{ steps.build_configuration.outputs.image_created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious
            org.opencontainers.image.version=${{ steps.build_configuration.outputs.release_version }}
          tags: ${{ steps.build_configuration.outputs.proxy_amd64_tag }}
          cache-from: type=gha,scope=proxy-amd64
          cache-to: type=gha,mode=max,compression=zstd,scope=proxy-amd64

      - name: Export amd64 proxy image as tarball
        if: steps.build_configuration.outputs.output_tarballs == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./kroxylicious-app
          file: ./kroxylicious-app/src/main/docker/proxy.dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/kroxylicious-proxy.img.tar
          build-args: |
            KROXYLICIOUS_VERSION=${{ steps.build_configuration.outputs.release_version }}
          labels: |
            org.opencontainers.image.created=${{ steps.build_configuration.outputs.image_created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious
            org.opencontainers.image.version=${{ steps.build_configuration.outputs.release_version }}
          tags: ${{ steps.build_configuration.outputs.proxy_amd64_tag }}
          cache-from: type=gha,scope=proxy-amd64
          cache-to: type=gha,mode=max,compression=zstd,scope=proxy-amd64

      - name: Build and maybe push operator image
        if: steps.build_configuration.outputs.output_tarballs != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./kroxylicious-kubernetes/kroxylicious-operator
          file: ./kroxylicious-kubernetes/kroxylicious-operator/src/main/docker/operator.dockerfile
          platforms: ${{ steps.build_configuration.outputs.operator_platforms }}
          push: ${{ steps.build_configuration.outputs.push_images == 'true' }}
          build-args: |
            KROXYLICIOUS_VERSION=${{ steps.build_configuration.outputs.release_version }}
          labels: |
            org.opencontainers.image.created=${{ steps.build_configuration.outputs.image_created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious
            org.opencontainers.image.version=${{ steps.build_configuration.outputs.release_version }}
          tags: ${{ steps.build_configuration.outputs.operator_tags }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,compression=zstd,scope=operator

      - name: Export operator image as tarball
        if: steps.build_configuration.outputs.output_tarballs == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./kroxylicious-kubernetes/kroxylicious-operator
          file: ./kroxylicious-kubernetes/kroxylicious-operator/src/main/docker/operator.dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/kroxylicious-operator.img.tar
          build-args: |
            KROXYLICIOUS_VERSION=${{ steps.build_configuration.outputs.release_version }}
          labels: |
            org.opencontainers.image.created=${{ steps.build_configuration.outputs.image_created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious
            org.opencontainers.image.version=${{ steps.build_configuration.outputs.release_version }}
          tags: ${{ steps.build_configuration.outputs.operator_tags }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,compression=zstd,scope=operator

      - name: Build and maybe push Admission webhook image
        if: steps.build_configuration.outputs.output_tarballs != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./kroxylicious-kubernetes/kroxylicious-admission
          file: ./kroxylicious-kubernetes/kroxylicious-admission/src/main/docker/webhook.dockerfile
          platforms: ${{ steps.build_configuration.outputs.admission_platforms }}
          push: ${{ steps.build_configuration.outputs.push_images == 'true' }}
          build-args: |
            KROXYLICIOUS_VERSION=${{ steps.build_configuration.outputs.release_version }}
          labels: |
            org.opencontainers.image.created=${{ steps.build_configuration.outputs.image_created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious
            org.opencontainers.image.version=${{ steps.build_configuration.outputs.release_version }}
          tags: ${{ steps.build_configuration.outputs.admission_tags }}
          cache-from: type=gha,scope=admission
          cache-to: type=gha,mode=max,compression=zstd,scope=admission

      - name: Export Admission webhook image as tarball
        if: steps.build_configuration.outputs.output_tarballs == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./kroxylicious-kubernetes/kroxylicious-admission
          file: ./kroxylicious-kubernetes/kroxylicious-admission/src/main/docker/webhook.dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/kroxylicious-webhook.img.tar
          build-args: |
            KROXYLICIOUS_VERSION=${{ steps.build_configuration.outputs.release_version }}
          labels: |
            org.opencontainers.image.created=${{ steps.build_configuration.outputs.image_created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious
            org.opencontainers.image.version=${{ steps.build_configuration.outputs.release_version }}
          tags: ${{ steps.build_configuration.outputs.admission_tags }}
          cache-from: type=gha,scope=admission
          cache-to: type=gha,mode=max,compression=zstd,scope=admission

      - name: Gzip image tarballs
        if: steps.build_configuration.outputs.output_tarballs == 'true'
        run: |
          gzip /tmp/kroxylicious-proxy.img.tar
          gzip /tmp/kroxylicious-operator.img.tar
          gzip /tmp/kroxylicious-webhook.img.tar

      # `clean package` on runtime+app wipes their target/ directories so the
      # aarch64 assembly contains only linux-aarch_64 Netty native binaries (no
      # amd64 leftovers). Scope limited to runtime+app: the operator and admission
      # webhook have no platform-specific native binaries.

      - name: Build arm64 distribution artifacts
        if: steps.build_configuration.outputs.multi_arch == 'true'
        run: |
          mvn --quiet \
            --batch-mode \
            --activate-profiles 'dist,aarch64,!qa' \
            --projects :kroxylicious-runtime,:kroxylicious-app \
            -Derrorprone.skip=true \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -DskipDocs=true \
            -DskipContainerImageBuild=true \
            clean package

      - name: Build and push arm64 proxy image
        if: steps.build_configuration.outputs.multi_arch == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./kroxylicious-app
          file: ./kroxylicious-app/src/main/docker/proxy.dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            KROXYLICIOUS_VERSION=${{ steps.build_configuration.outputs.release_version }}
          labels: |
            org.opencontainers.image.created=${{ steps.build_configuration.outputs.image_created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious
            org.opencontainers.image.version=${{ steps.build_configuration.outputs.release_version }}
          tags: ${{ steps.build_configuration.outputs.proxy_arm64_tag }}
          cache-from: type=gha,scope=proxy-arm64
          cache-to: type=gha,mode=max,compression=zstd,scope=proxy-arm64

      - name: Verify arm64 proxy image native libraries
        if: steps.build_configuration.outputs.multi_arch == 'true'
        run: |
          ARM64_TAG="${{ steps.build_configuration.outputs.proxy_arm64_tag }}"
          echo "Verifying arm64 native libs in ${ARM64_TAG}..."
          _CONTAINER_ID=$(docker create --platform linux/arm64 "${ARM64_TAG}")
          _NATIVE_DIR=$(mktemp -d)
          docker cp "${_CONTAINER_ID}:/opt/kroxylicious/libs/native/netty/." "${_NATIVE_DIR}/"
          docker rm "${_CONTAINER_ID}" > /dev/null
          _AARCH64_COUNT=$(find "${_NATIVE_DIR}" -name '*aarch_64*' | wc -l | tr -d ' ')
          _X86_64_COUNT=$(find "${_NATIVE_DIR}" -name '*x86_64*' | wc -l | tr -d ' ')
          rm -rf "${_NATIVE_DIR}"
          if [[ "${_AARCH64_COUNT}" -gt 0 && "${_X86_64_COUNT}" -eq 0 ]]; then
            echo "arm64 proxy image OK: ${_AARCH64_COUNT} aarch_64 native lib(s), no x86_64 libs."
          else
            echo "ERROR: arm64 native lib check failed (aarch_64=${_AARCH64_COUNT}, x86_64=${_X86_64_COUNT})." >&2
            exit 1
          fi

      # Netty has no ppc64le/s390x native transports; the ppc64le and s390x profiles
      # drop the native transport JARs so the distribution ships no foreign binaries.
      # The distribution tarballs are handed to the native runners, which only build
      # the image (see build-proxy-power-z).

      - name: Build ppc64le and s390x distribution artifacts
        if: steps.build_configuration.outputs.power_z == 'true'
        env:
          RELEASE_VERSION: ${{ steps.build_configuration.outputs.release_version }}
        run: |
          mkdir -p /tmp/proxy-dist
          for ARCH in ppc64le s390x; do
            mvn --quiet \
              --batch-mode \
              --activate-profiles "dist,${ARCH},!qa" \
              --projects :kroxylicious-runtime,:kroxylicious-app \
              -Derrorprone.skip=true \
              -DskipTests \
              -Dmaven.javadoc.skip=true \
              -DskipDocs=true \
              -DskipContainerImageBuild=true \
              clean package
            mkdir -p "/tmp/proxy-dist/${ARCH}"
            cp "kroxylicious-app/target/kroxylicious-app-${RELEASE_VERSION}-bin.tar.gz" "/tmp/proxy-dist/${ARCH}/"
          done

      - name: Archive ppc64le proxy distribution
        if: steps.build_configuration.outputs.power_z == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kroxylicious-proxy-dist-ppc64le
          path: /tmp/proxy-dist/ppc64le/
          retention-days: 1
          if-no-files-found: error

      - name: Archive s390x proxy distribution
        if: steps.build_configuration.outputs.power_z == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kroxylicious-proxy-dist-s390x
          path: /tmp/proxy-dist/s390x/
          retention-days: 1
          if-no-files-found: error

      - name: Slack Notification on Failure
        if: failure() && env.SLACK_WEBHOOK_SET == 'true' && github.event_name == 'push'
        uses: $/.github/actions/common/slack-notification
        with:
          name: kroxylicious-proxy
          path: /tmp/kroxylicious-proxy.img.tar.gz
          retention-days: 1

      - name: Archive proxy image tarball
        if: steps.build_configuration.outputs.output_tarballs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kroxylicious-proxy
          path: /tmp/kroxylicious-proxy.img.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Archive operator image tarball
        if: steps.build_configuration.outputs.output_tarballs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kroxylicious-operator
          path: /tmp/kroxylicious-operator.img.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Archive admission webhook image tarball
        if: steps.build_configuration.outputs.output_tarballs == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kroxylicious-admission-webhook
          path: /tmp/kroxylicious-webhook.img.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-proxy-power-z:
    needs: build
    if: needs.build.outputs.power_z == 'true'
    strategy:
      matrix:
        arch: [ ppc64le, s390x ]
    # IBM-provided self-hosted runners, see https://github.com/IBM/actionspz
    runs-on: ubuntu-24.04-${{ matrix.arch }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download proxy distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kroxylicious-proxy-dist-${{ matrix.arch }}
          path: /tmp/proxy-dist

      - name: Unpack proxy distribution
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          # Recreate the layout the proxy Dockerfile copies from.
          DIST_DIR="kroxylicious-app/target/kroxylicious-app-${RELEASE_VERSION}-bin"
          mkdir -p "${DIST_DIR}"
          tar -xzf "/tmp/proxy-dist/kroxylicious-app-${RELEASE_VERSION}-bin.tar.gz" -C "${DIST_DIR}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ vars.REGISTRY_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push ${{ matrix.arch }} proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./kroxylicious-app
          file: ./kroxylicious-app/src/main/docker/proxy.dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            KROXYLICIOUS_VERSION=${{ needs.build.outputs.release_version }}
          labels: |
            org.opencontainers.image.created=${{ needs.build.outputs.image_created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious
            org.opencontainers.image.version=${{ needs.build.outputs.release_version }}
          tags: ${{ needs.build.outputs.proxy_arch_tag_prefix }}-${{ matrix.arch }}
          cache-from: type=gha,scope=proxy-${{ matrix.arch }}
          cache-to: type=gha,mode=max,compression=zstd,scope=proxy-${{ matrix.arch }}

      - name: Verify ${{ matrix.arch }} proxy image
        env:
          IMAGE_TAG: ${{ needs.build.outputs.proxy_arch_tag_prefix }}-${{ matrix.arch }}
        run: |
          echo "Verifying ${IMAGE_TAG}..."
          # The image runs natively on this runner, so check the JVM actually starts.
          docker run --rm --entrypoint java "${IMAGE_TAG}" -version
          _CONTAINER_ID=$(docker create "${IMAGE_TAG}")
          _NATIVE_DIR=$(mktemp -d)
          docker cp "${_CONTAINER_ID}:/opt/kroxylicious/libs/native/." "${_NATIVE_DIR}/"
          docker rm "${_CONTAINER_ID}" > /dev/null
          # Netty publishes no native transports for this arch, so none must be present.
          _NETTY_COUNT=$(find "${_NATIVE_DIR}" -path '*netty*' -type f | wc -l | tr -d ' ')
          _ZSTD_COUNT=$(find "${_NATIVE_DIR}/zstd-jni/linux/${{ matrix.arch }}" -name '*.so' 2>/dev/null | wc -l | tr -d ' ')
          rm -rf "${_NATIVE_DIR}"
          if [[ "${_NETTY_COUNT}" -eq 0 && "${_ZSTD_COUNT}" -gt 0 ]]; then
            echo "${{ matrix.arch }} proxy image OK: no Netty native libs, ${_ZSTD_COUNT} zstd native lib(s)."
          else
            echo "ERROR: ${{ matrix.arch }} native lib check failed (netty=${_NETTY_COUNT}, zstd=${_ZSTD_COUNT})." >&2
            exit 1
          fi

  proxy-manifest:
    needs: [ build, build-proxy-power-z ]
    # build-proxy-power-z is skipped outside kroxylicious/kroxylicious; in that case the
    # manifest covers amd64 and arm64 only. A failed ppc64le/s390x build fails the manifest.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.multi_arch == 'true' && needs.build-proxy-power-z.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ vars.REGISTRY_SERVER }}
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Create and push proxy multi-arch manifest
        env:
          PROXY_FINAL_TAGS: ${{ needs.build.outputs.proxy_final_tags }}
          PROXY_AMD64_TAG: ${{ needs.build.outputs.proxy_amd64_tag }}
          PROXY_ARM64_TAG: ${{ needs.build.outputs.proxy_arm64_tag }}
          PROXY_ARCH_TAG_PREFIX: ${{ needs.build.outputs.proxy_arch_tag_prefix }}
          POWER_Z_RESULT: ${{ needs.build-proxy-power-z.result }}
        run: |
          SOURCES=("${PROXY_AMD64_TAG}" "${PROXY_ARM64_TAG}")
          if [[ "${POWER_Z_RESULT}" == "success" ]]; then
            SOURCES+=("${PROXY_ARCH_TAG_PREFIX}-ppc64le" "${PROXY_ARCH_TAG_PREFIX}-s390x")
          fi
          for TAG in $(echo "${PROXY_FINAL_TAGS}" | tr ',' ' '); do
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.created=${{ needs.build.outputs.image_created }}" \
              --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
              --annotation "index:org.opencontainers.image.source=https://github.com/kroxylicious/kroxylicious" \
              --annotation "index:org.opencontainers.image.version=${{ needs.build.outputs.release_version }}" \
              -t "${TAG}" \
              "${SOURCES[@]}"
          done
