name: "Setup Maven Offline Releases"
description: "Configure Maven to trust cached release artifacts without network verification (updatePolicy=never)"

# Downstream CI workflows (documentation-tests, integration-tests, system-tests, etc.) run in
# parallel after maven.yaml has warmed the Maven package cache. Even with a warm cache, Maven
# contacts Maven Central to verify that cached release artifacts are still current, which
# triggers HTTP 429 rate-limit errors when many jobs run simultaneously.
#
# Setting updatePolicy=never for release repositories tells Maven to trust whatever is in the
# local cache without re-verifying against the remote, eliminating the unnecessary network
# traffic and the 429 errors it causes.
#
# The profile is written to Maven's global settings (MAVEN_HOME/conf/settings.xml) rather than
# the user settings (~/.m2/settings.xml). Maven merges both files, so the updatePolicy takes
# effect regardless of what is in user settings. It also leaves ~/.m2/settings.xml entirely free
# for other actions (e.g. setup-java writing server credentials for release workflows) to manage
# without any risk of conflict or ordering dependency between this action and those actions.

runs:
  using: "composite"
  steps:
    - name: 'Write updatePolicy=never to Maven global settings'
      shell: bash
      run: |
        MAVEN_HOME=$(mvn --version | grep 'Maven home' | sed 's/Maven home: //')
        cat > "${MAVEN_HOME}/conf/settings.xml" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <profiles>
            <profile>
              <id>ci-offline-releases</id>
              <repositories>
                <repository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                  <releases>
                    <enabled>true</enabled>
                    <updatePolicy>never</updatePolicy>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>central</id>
                  <url>https://repo.maven.apache.org/maven2</url>
                  <releases>
                    <enabled>true</enabled>
                    <updatePolicy>never</updatePolicy>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>ci-offline-releases</activeProfile>
          </activeProfiles>
        </settings>
        EOF
