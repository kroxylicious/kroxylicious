title: "fix(authorizer-acl): keep regex escapes in 'matching' literals, and accept block comments in ACL rules files"
type: fixed
issues:
  - 5236
important_notes:
  - "**Behaviour change**: in a `matching /…/` literal, a backslash before any character other than `/` or `\\` is now kept as part of the regular expression. `/orders\\.v1/` now matches only `orders.v1`; it previously matched `ordersXv1` too, because the backslash was dropped. Patterns written with doubled backslashes (`/orders\\\\.v1/`) are unchanged."
