title: remove kafka-clients ApiException from KafkaProxyExceptionMapper
merge_requests:
  - 4771
issues:
  - 4782
type: changed
important_notes:
  - "An undocumented behaviour in the Filter API has been removed. Previously if a\
    \ request filter returned an exceptionally completed future, we would use that\
    \ exception type to determine which error code to set on the response. We are\
    \ removing all integration with the kafka exception hierarchy so now any exceptionally\
    \ completed request futures will result in an UNKNOWN_SERVER_ERROR response to\
    \ the client. Filters that want specialized error responses should use the `errorResponse`\
    \ APIs on `FilterContext#requestFilterResultBuilder`."

