---
Configuration:
  status: WARN
  name: Tests
  Appenders:
    Console:
        name: Console
        type: Console
        target: SYSTEM_OUT
        PatternLayout:
            pattern: '%d{yyyy-MM-dd HH:mm:ss} %-5p <%t> %c{1.} - %m%replace{ %K{ctx}}{'' $''}{}%n'
  Loggers:
    Root:
      additivity: false
      level: WARN
      AppenderRef:
        - ref: Console
          level: WARN

