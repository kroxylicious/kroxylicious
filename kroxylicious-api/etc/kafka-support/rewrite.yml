#
# OpenRewrite recipe used by refresh.sh to relocate the vendored Kafka support classes from
# org.apache.kafka.common.* to io.kroxylicious.kafka.common.*. The FindSourceFiles precondition
# path-scopes the rewrite to freshly-copied files sitting under an org/apache/kafka/** path, so it
# never touches a module's own org.apache.kafka.* usage. ChangePackage rewrites package decls,
# imports, fully-qualified references and relocates the files on disk to the new package path.
---
type: specs.openrewrite.org/v1beta/recipe
name: io.kroxylicious.RewriteCopiedKafka
displayName: Relocate vendored Kafka common classes to io.kroxylicious.kafka.common
description: >-
  Rewrites copied org.apache.kafka.common.* support classes into the
  io.kroxylicious.kafka.common.* namespace so the vendored protocol surface references no
  org.apache.kafka packages.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/org/apache/kafka/**'
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.kafka.common
      newPackageName: io.kroxylicious.kafka.common
      recursive: true
