---
useIoUring: false
management:
  endpoints:
    prometheus: {}
clusterDefinitions:
  - name: demo-cluster
    bootstrapServers: kafka-1:9092
virtualClusters:
  - name: demo
    target:
      cluster: demo-cluster
    gateways:
      - name: compose
        portIdentifiesNode:
          bootstrapAddress: kroxylicious:9192
          nodeIdRanges:
            - name: "default"
              start: 0
              end: 3
      - name: host
        portIdentifiesNode:
          bootstrapAddress: localhost:9292
          nodeIdRanges:
            - name: "default"
              start: 0
              end: 3
    logNetwork: false
    logFrames: false
filterDefinitions:
defaultFilters: