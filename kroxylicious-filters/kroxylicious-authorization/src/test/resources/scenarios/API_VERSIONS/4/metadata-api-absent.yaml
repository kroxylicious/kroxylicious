---
metadata:
  apiKeys: "API_VERSIONS"
  apiVersion: 4
  scenario: |
    If the Metadata api is not supported by the upstream , the proxy must log an error message and close the connection.
given:
  mockedUpstreamResponses:
    - expectedRequestKey: "API_VERSIONS"
      expectedRequestVersion: 4
      expectedRequestHeader:
        requestApiKey: 18
        requestApiVersion: 4
        correlationId: 1
        clientId: "clientId"
      expectedRequest:
        clientSoftwareName: "random-string-313"
        clientSoftwareVersion: "random-string-234"
      upstreamResponseHeader:
        correlationId: 1
      upstreamResponse:
        errorCode: 0
        apiKeys:
          - apiKey: 0 # PRODUCE
            minVersion: 0
            maxVersion: 1
        throttleTimeMs: 880
  authorizerRules:
    allowed:
      - subject: "alice"
        resourceName: "my-topic"
        resourceClass: "TOPIC"
        resourceType: "DESCRIBE"
  topicNames: null
when:
  subject: "alice"
  requestHeader:
    requestApiKey: 18
    requestApiVersion: 4
    correlationId: 1
    clientId: "clientId"
  request:
    clientSoftwareName: "random-string-313"
    clientSoftwareVersion: "random-string-234"
then:
  expectAdditionalLogs:
    - level: ERROR
      message: Filter requires broker to support at least METADATA API version 4. Connected broker does not advertise support for the Metadata API
  expectCloseConnection: true
