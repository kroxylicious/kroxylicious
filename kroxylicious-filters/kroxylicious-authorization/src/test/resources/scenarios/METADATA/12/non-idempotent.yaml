---
# Regression test for https://github.com/kroxylicious/kroxylicious/issues/3759
# When a client sends allowAutoTopicCreation=true before the ApiVersions exchange has completed
# (useMetadataVersion == -1), the internal probe must use the client's negotiated version (v12),
# not latestVersion() (v13). A broker capped at v12 (e.g. Kafka 3.5) would reject a v13 probe.
metadata:
  apiKeys: "METADATA"
  apiVersion: 12
  scenario: "non-idempotent before ApiVersions exchange"
given:
  mockedUpstreamResponses:
    - expectedRequestKey: "METADATA"
      expectedRequestVersion: 12
      expectedRequestHeader:
        requestApiKey: 3
        requestApiVersion: 12
        correlationId: 0
        clientId: "clientId"
      expectedRequest:
        topics:
          - topicId: "Xn83BxP-S4C8MqoMjIf6uw"
            name: "my-topic"
        allowAutoTopicCreation: false
        includeTopicAuthorizedOperations: false
      upstreamResponseHeader:
        correlationId: 1
      upstreamResponse:
        throttleTimeMs: 746
        brokers:
          - nodeId: 179
            host: "random-string-71"
            port: 176
            rack: "random-string-836"
        clusterId: "random-string-682"
        controllerId: 892
        topics:
          - errorCode: 820
            name: "my-topic"
            topicId: "u0gwV8JNSUqcw-cK7k6TJA"
            isInternal: false
            partitions:
              - errorCode: 922
                partitionIndex: 1006
                leaderId: 773
                leaderEpoch: 652
                replicaNodes:
                  - 387
                isrNodes:
                  - 647
                offlineReplicas:
                  - 421
            topicAuthorizedOperations: 769
        errorCode: 0
    - expectedRequestKey: "METADATA"
      expectedRequestVersion: 12
      expectedRequestHeader:
        requestApiKey: 3
        requestApiVersion: 12
        correlationId: 1
        clientId: "clientId"
      expectedRequest:
        topics: [ ]
        allowAutoTopicCreation: true
        includeTopicAuthorizedOperations: false
      upstreamResponseHeader:
        correlationId: 1
      upstreamResponse:
        throttleTimeMs: 746
        brokers:
          - nodeId: 179
            host: "random-string-71"
            port: 176
            rack: "random-string-836"
        clusterId: "random-string-682"
        controllerId: 892
        topics:
          - errorCode: 820
            name: "my-topic"
            topicId: "u0gwV8JNSUqcw-cK7k6TJA"
            isInternal: false
            topicAuthorizedOperations: 760
            partitions:
              - errorCode: 922
                partitionIndex: 1006
                leaderId: 773
                leaderEpoch: 652
                replicaNodes:
                  - 387
                isrNodes:
                  - 647
                offlineReplicas:
                  - 421
        errorCode: 0
  authorizerRules:
    allowed:
      - subject: "alice"
        resourceName: "my-topic"
        resourceClass: "TOPIC"
        resourceType: "CREATE"
      - subject: "alice"
        resourceName: "my-topic"
        resourceClass: "TOPIC"
        resourceType: "DESCRIBE"
  topicNames: null
when:
  subject: "alice"
  requestHeader:
    requestApiKey: 3
    requestApiVersion: 12
    correlationId: 1
    clientId: "clientId"
  request:
    topics:
      - topicId: "Xn83BxP-S4C8MqoMjIf6uw"
        name: "my-topic"
    allowAutoTopicCreation: true
    includeTopicAuthorizedOperations: false
then:
  expectedResponseHeader:
    correlationId: 1
  expectedResponse:
    throttleTimeMs: 746
    brokers:
      - nodeId: 179
        host: "random-string-71"
        port: 176
        rack: "random-string-836"
    clusterId: "random-string-682"
    controllerId: 892
    topics:
      - errorCode: 820
        name: "my-topic"
        topicId: "u0gwV8JNSUqcw-cK7k6TJA"
        isInternal: false
        partitions:
          - errorCode: 922
            partitionIndex: 1006
            leaderId: 773
            leaderEpoch: 652
            replicaNodes:
              - 387
            isrNodes:
              - 647
            offlineReplicas:
              - 421
        topicAuthorizedOperations: 760
