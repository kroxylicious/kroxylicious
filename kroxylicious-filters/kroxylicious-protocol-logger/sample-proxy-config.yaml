# Sample config to smoke-test the ProtocolLogger filter.
# Start Kafka on localhost:9092, then run the proxy with this config.
# The proxy listens on localhost:9192 and logs every protocol message at DEBUG.
# The logging backend must also be enabled at DEBUG for
# io.kroxylicious.filter.protocollogger.ProtocolLoggerFilter, or no output appears.
---
management:
  endpoints:
    prometheus: {}
clusterDefinitions:
  - name: demo-cluster
    bootstrapServers: localhost:9092
virtualClusters:
  - name: demo
    target:
      cluster: demo-cluster
    gateways:
      - name: default
        portIdentifiesNode:
          bootstrapAddress: localhost:9192
    logNetwork: false
    logFrames: false
filterDefinitions:
  - name: protocol-logger
    type: ProtocolLogger
    # Omit config entirely to log all API keys.
    # To log only specific RPCs, uncomment and edit:
    # config:
    #   apiKeyNames:
    #     - PRODUCE
    #     - FETCH
    #     - METADATA
defaultFilters:
  - protocol-logger
