---
Configuration:
  status: WARN
  name: Config
  Appenders:
    Console:
      - name: STDOUT
        target: SYSTEM_ERR
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p %c{2.} - %m%n"
  Loggers:
    Root:
      level: "${env:CREDENTIAL_TOOL_LOG_LEVEL:-WARN}"
      additivity: false
      AppenderRef:
        - ref: STDOUT
