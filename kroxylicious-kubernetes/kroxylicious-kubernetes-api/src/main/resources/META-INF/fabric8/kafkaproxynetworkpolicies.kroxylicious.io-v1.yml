                  type: object
                  description: Network policy settings for the KafkaProxy itself.
                  required:
                    - proxyRef
                    - allowEgressToClusterDns
                    - allowIngressForMetrics
                  properties:
                    proxyRef:
                      # Mapped to Java type io.kroxylicious.kubernetes.api.common.ProxyRef
                      type: object
                      description: "Specifies the KafkaProxy this network policy applies to."
