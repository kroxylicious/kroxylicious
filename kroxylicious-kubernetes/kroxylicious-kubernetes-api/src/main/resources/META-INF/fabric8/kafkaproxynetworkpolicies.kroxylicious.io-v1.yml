# Note the v1 in the filename refers to the version of the CustomResourceDefinition
# not any of the versions of API being defined.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  # name must match the spec fields below, and be in the form: <plural>.<group>
  name: kafkaproxynetworkpolicies.kroxylicious.io
spec:
  # group name to use for REST API: /apis/<group>/<version>
  group: kroxylicious.io
  scope: Namespaced
  names:
    plural: kafkaproxynetworkpolicies
    singular: kafkaproxynetworkpolicy
    kind: KafkaProxyNetworkPolicy
    shortNames:
      - kpnp
    categories:
      - kroxylicious
  # list of versions supported by this CustomResourceDefinition
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: { }
      additionalPrinterColumns:
        - name: Proxy
          description: The name of the proxy that this network policy applies to.
          jsonPath: ".spec.kafkaProxy.proxyRef.name"
          type: string
          priority: 0
        - name: ResolvedRefs
          description: Whether the other resources referenced by this network policy can be found.
          jsonPath: ".status.conditions[?(@.type==\"ResolvedRefs\")].status"
          type: string
          priority: 0
        - name: Accepted
          description: Whether this network policy has been accepted by the operator.
          jsonPath: ".status.conditions[?(@.type==\"Accepted\")].status"
          type: string
          priority: 0
        - name: Programmed
          description: Whether the NetworkPolicies implied by this network policy have been written to the API server.
          jsonPath: ".status.conditions[?(@.type==\"Programmed\")].status"
          type: string
          priority: 0
      schema:
        openAPIV3Schema:
          type: object
          properties:
            metadata:
              type: object
            spec:
              type: object
              required:
                - defaultIngress
                - defaultEgress
                - kafkaProxy
                - kafkaProxyIngresses
                - kafkaServices
                - kafkaProtocolFilters
              properties:
                defaultIngress:
                  type: string
                  description: |
                    How ingress is handled for every KafkaProxyIngress attached to the proxy
                    which has no corresponding entry in spec.kafkaProxyIngresses.
                  enum: [ "allow-all", "deny-all" ]
                defaultEgress:
                  type: string
                  description: |
                    How egress is handled for every KafkaService or KafkaProtocolFilter attached
                    to the proxy which has no corresponding entry in spec.kafkaServices or
                    spec.kafkaProtocolFilters.
                  enum: [ "allow-all", "deny-all" ]
