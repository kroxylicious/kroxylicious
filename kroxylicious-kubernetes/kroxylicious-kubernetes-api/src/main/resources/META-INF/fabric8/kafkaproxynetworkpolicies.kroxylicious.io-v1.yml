                      x-kubernetes-validations:
                        - rule: "self == oldSelf"
                          message: "spec.kafkaProxy.proxyRef is immutable"
                      properties:
                        name:
                          description: Name is the name of the referent.
                          maxLength: 253
                          minLength: 1
                          type: string
                    allowEgressToClusterDns:
                      type: boolean
                      description: |
                        Whether the proxy is allowed to make egress connections to the cluster DNS
                        servers. When true a rule permitting UDP and TCP port 53 to the cluster's
                        DNS pods is generated. This does not account for every possible DNS
                        topology; see the documentation for known limitations.
                    allowIngressForMetrics:
                      type: array
                      description: |
                        Ingress rules allowing a metrics collector to scrape the proxy's metrics
                        endpoint. The operator knows the port, so rules must not specify one.
                      items:
                        # Mapped to Java type io.fabric8.kubernetes.api.model.networking.v1.NetworkPolicyIngressRule
                        type: object
                        properties:
                          from:
                            type: array
                            description: The sources allowed to connect to the metrics endpoint.
                            items:
                              type: object
                              description: |
                                A peer for a NetworkPolicy rule. Exactly one of ipBlock,
                                namespaceSelector or podSelector is normally supplied; an empty
                                peer matches everything.
                              properties:
                                ipBlock:
                                  description: |
                                    IPBlock describes a particular CIDR (e.g. "192.168.1.0/24" or
                                    "2001:db8::/64") that is allowed to the proxy pods. The except
                                    entry describes CIDRs that should not be included within this rule.
                                  type: object
                                  required:
                                    - cidr
                                  properties:
                                    cidr:
                                      description: A CIDR, for example "192.168.1.0/24" or "2001:db8::/64".
                                      type: string
                                    except:
                                      description: CIDRs that should not be included within this IPBlock.
                                      type: array
                                      items:
                                        type: string
                                namespaceSelector:
                                  description: |
                                    A label query over a set of namespaces. An empty selector
                                    matches all namespaces; an absent selector matches no
                                    namespaces (subject to the presence of podSelector).
                                  type: object
                                  properties:
                                    matchLabels:
                                      description: A map of {key,value} pairs. The requirements are ANDed.
                                      type: object
                                      additionalProperties:
                                        type: string
                                    matchExpressions:
                                      description: A list of label selector requirements. The requirements are ANDed.
                                      type: array
                                      items:
                                        type: object
                                        required:
                                          - key
                                          - operator
                                        properties:
                                          key:
                                            description: The label key that the selector applies to.
                                            type: string
                                          operator:
                                            description: |
                                              The key's relationship to a set of values. Valid
                                              operators are In, NotIn, Exists and DoesNotExist.
                                            type: string
                                          values:
                                            description: |
                                              An array of string values. If the operator is In or
                                              NotIn the values array must be non-empty. If the
                                              operator is Exists or DoesNotExist the values array
                                              must be empty.
                                            type: array
                                            items:
                                              type: string
                                podSelector:
                                  description: |
                                    A label query over a set of pods. An empty selector matches
                                    all pods in the selected namespaces.
                                  type: object
                                  properties:
                                    matchLabels:
                                      description: A map of {key,value} pairs. The requirements are ANDed.
                                      type: object
                                      additionalProperties:
                                        type: string
                                    matchExpressions:
                                      description: A list of label selector requirements. The requirements are ANDed.
                                      type: array
                                      items:
                                        type: object
                                        required:
                                          - key
                                          - operator
                                        properties:
                                          key:
                                            description: The label key that the selector applies to.
                                            type: string
                                          operator:
                                            description: |
                                              The key's relationship to a set of values. Valid
                                              operators are In, NotIn, Exists and DoesNotExist.
                                            type: string
                                          values:
                                            description: |
                                              An array of string values. If the operator is In or
                                              NotIn the values array must be non-empty. If the
                                              operator is Exists or DoesNotExist the values array
                                              must be empty.
                                            type: array
                                            items:
                                              type: string
