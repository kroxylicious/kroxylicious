                          egress for this filter.
                        items:
                          # Mapped to Java type io.fabric8.kubernetes.api.model.networking.v1.NetworkPolicyEgressRule
                          type: object
                          properties:
                            ports:
                              type: array
                              description: The destination ports for this rule.
                              items:
                                type: object
                                description: A port to allow traffic on.
                                properties:
                                  protocol:
                                    description: The protocol (TCP, UDP or SCTP) which traffic must match.
                                    type: string
                                  port:
                                    description: |
                                      The port on the given protocol. This can either be a numerical
                                      or named port on a pod. If this field is not provided, it
                                      matches all port names and numbers.
                                    x-kubernetes-int-or-string: true
                                  endPort:
                                    description: |
                                      The inclusive upper bound of a range of ports starting at
                                      port. May only be set when port is a number.
                                    type: integer
                                    format: int32
                            to:
                              type: array
                              description: The destinations for this rule. An empty list means anywhere.
                              items:
                                type: object
                                description: |
                                  A peer for a NetworkPolicy rule. Exactly one of ipBlock,
                                  namespaceSelector or podSelector is normally supplied; an empty
                                  peer matches everything.
                                properties:
                                  ipBlock:
                                    description: |
                                      IPBlock describes a particular CIDR (e.g. "192.168.1.0/24"
