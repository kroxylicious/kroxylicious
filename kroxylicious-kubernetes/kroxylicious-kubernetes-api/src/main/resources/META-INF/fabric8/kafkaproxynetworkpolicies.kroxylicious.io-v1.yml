            status:
              type: object
              properties:
                observedGeneration:
                  description: |
                    The metadata.generation that was observed during the last reconciliation by the operator.
                  type: integer
                effectivelyUnrestrictedIngress:
                  description: |
                    True if any generated ingress NetworkPolicy for the proxy allows all sources.
                  type: boolean
                effectivelyUnrestrictedEgress:
                  description: |
                    True if any generated egress NetworkPolicy for the proxy allows all destinations.
                  type: boolean
                conditions:
                  # Mapped to Java type io.kroxylicious.kubernetes.api.common.Condition
                  type: array
                  items:
