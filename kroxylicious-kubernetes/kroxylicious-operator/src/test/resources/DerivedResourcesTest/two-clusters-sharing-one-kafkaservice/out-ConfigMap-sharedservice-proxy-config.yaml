---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  labels:
    app.kubernetes.io/managed-by: "kroxylicious-operator"
    app.kubernetes.io/name: "kroxylicious"
    app.kubernetes.io/instance: "sharedservice"
    app.kubernetes.io/component: "proxy"
  name: "sharedservice-proxy-config"
  namespace: "proxy-ns"
  ownerReferences:
    - apiVersion: "kroxylicious.io/v1alpha1"
      kind: "KafkaProxy"
      name: "sharedservice"
data:
  proxy-config.yaml: |-
    ---
    management:
      endpoints:
        prometheus: {}
    clusterDefinitions:
    - name: "sharedref"
      bootstrapServers: "first-kafka.kafka1.svc.cluster.local:9092"
      bootstrapServerSelection:
        strategy: "round-robin"
    virtualClusters:
    - name: "bar"
      target:
        cluster: "sharedref"
      gateways:
      - name: "load-balancer"
        sniHostIdentifiesNode:
          bootstrapAddress: "$(virtualClusterName).kafkaproxy:9291"
          advertisedBrokerAddressPattern: "$(virtualClusterName)-$(nodeId).kafkaproxy:9083"
        tls:
          key:
            privateKeyFile: "/opt/kroxylicious/virtual-cluster/server-certs/downstream-tls-cert/tls.key"
            certificateFile: "/opt/kroxylicious/virtual-cluster/server-certs/downstream-tls-cert/tls.crt"
    - name: "foo"
      target:
        cluster: "sharedref"
      gateways:
      - name: "load-balancer"
        sniHostIdentifiesNode:
          bootstrapAddress: "$(virtualClusterName).kafkaproxy:9291"
          advertisedBrokerAddressPattern: "$(virtualClusterName)-$(nodeId).kafkaproxy:9083"
        tls:
          key:
            privateKeyFile: "/opt/kroxylicious/virtual-cluster/server-certs/downstream-tls-cert/tls.key"
            certificateFile: "/opt/kroxylicious/virtual-cluster/server-certs/downstream-tls-cert/tls.crt"
