---
apiVersion: "v1"
kind: "Service"
metadata:
  annotations:
    kroxylicious.io/bootstrap-servers: "{\"version\":\"0.13.0\",\"bootstrapServers\":[{\"clusterName\":\"one\",\"ingressName\"\
      :\"lb-with-proxy-protocol\",\"bootstrapServers\":\"one.with-pp.kafkaproxy:9083\"}]}"
  labels:
    app.kubernetes.io/managed-by: "kroxylicious-operator"
    app.kubernetes.io/name: "kroxylicious"
    app.kubernetes.io/instance: "minimal"
    app.kubernetes.io/component: "proxy"
  name: "lb-with-proxy-protocol"
  namespace: "proxy-ns"
  ownerReferences:
    - apiVersion: "kroxylicious.io/v1alpha1"
      kind: "KafkaProxy"
      name: "minimal"
    - apiVersion: "kroxylicious.io/v1alpha1"
      kind: "KafkaProxyIngress"
      name: "lb-with-proxy-protocol"
spec:
  ports:
    - name: "sni-9083"
      port: 9083
      protocol: "TCP"
      targetPort: 9290
  selector:
    app.kubernetes.io/managed-by: "kroxylicious-operator"
    app.kubernetes.io/name: "kroxylicious"
    app.kubernetes.io/instance: "minimal"
    app.kubernetes.io/component: "proxy"
  type: "LoadBalancer"