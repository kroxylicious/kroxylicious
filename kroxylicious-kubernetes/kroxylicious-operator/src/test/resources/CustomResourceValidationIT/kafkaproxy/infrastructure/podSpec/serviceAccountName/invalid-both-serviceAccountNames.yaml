---
resource:
  kind: KafkaProxy
  apiVersion: kroxylicious.io/v1alpha1
  metadata:
    name: invalid-both-service-account-names
    namespace: proxy-ns
  spec:
    infrastructure:
      serviceAccountName: kroxylicious-proxy
      podSpec:
        serviceAccountName: kroxylicious-proxy
expectFailureMessageToContain: |-
  serviceAccountName is deprecated and must not be set together with podSpec.serviceAccountName
