---
resource:
  kind: KafkaProxy
  apiVersion: kroxylicious.io/v1alpha1
  metadata:
    name: invalid-node-selector
    namespace: proxy-ns
  spec:
    infrastructure:
      nodeSelector:
        disktype: 1
expectFailureMessageToContain: |-
  spec.infrastructure.nodeSelector.disktype
