---
resource:
  kind: KafkaProxy
  apiVersion: kroxylicious.io/v1alpha1
  metadata:
    name: invalid-tsc-topology-key-missing
    namespace: proxy-ns
  spec:
    infrastructure:
      topologySpreadConstraints:
        - maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
expectFailureMessageToContain: |-
  spec.infrastructure.topologySpreadConstraints[0].topologyKey
