---
kind: KafkaProxyIngress
apiVersion: kroxylicious.io/v1alpha1
metadata:
  name: load-balancer-etp-cluster
  namespace: proxy-ns
  generation: 1
spec:
  proxyRef:
    name: "my-proxy"
  loadBalancer:
    bootstrapAddress: "bootstrap.kafka"
    advertisedBrokerAddressPattern: "broker-$(nodeId).kafka"
    service:
      externalTrafficPolicy: Cluster
