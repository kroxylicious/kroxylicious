---
resource:
  kind: KafkaProxyIngress
  apiVersion: kroxylicious.io/v1alpha1
  metadata:
    name: load-balancer-alloc-not-boolean
    namespace: proxy-ns
    generation: 1
  spec:
    proxyRef:
      name: "my-proxy"
    loadBalancer:
      bootstrapAddress: "bootstrap.kafka"
      advertisedBrokerAddressPattern: "broker-$(nodeId).kafka"
      service:
        allocateLoadBalancerNodePorts: 123
expectFailureMessageToContain: 'spec.loadBalancer.service.allocateLoadBalancerNodePorts in body must be of type boolean: "integer"'
