---
kind: KafkaProxyNetworkPolicy
apiVersion: kroxylicious.io/v1alpha1
metadata:
  name: strimzi-bare-service-entry
  namespace: proxy-ns
spec:
  defaultIngress: deny-all
  defaultEgress: deny-all
  kafkaProxy:
    proxyRef:
      name: my-proxy
    allowEgressToClusterDns: true
    allowIngressForMetrics: []
  kafkaProxyIngresses: []
  kafkaServices:
    - serviceRef:
        name: strimzi-target
  kafkaProtocolFilters: []
