---
kind: KafkaProxyNetworkPolicy
apiVersion: kroxylicious.io/v1alpha1
metadata:
  name: egress-anywhere
  namespace: proxy-ns
spec:
  defaultIngress: deny-all
  defaultEgress: deny-all
  kafkaProxy:
    proxyRef:
      name: my-proxy
    allowEgressToClusterDns: false
    allowIngressForMetrics: []
  kafkaProxyIngresses: []
  kafkaServices:
    - serviceRef:
        name: my-external-kafka-cluster
      allowEgress:
        - ports:
            - protocol: TCP
          to: []
  kafkaProtocolFilters: []
