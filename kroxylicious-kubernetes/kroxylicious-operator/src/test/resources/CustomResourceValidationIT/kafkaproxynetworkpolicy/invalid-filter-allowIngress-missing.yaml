---
resource:
  kind: KafkaProxyNetworkPolicy
  apiVersion: kroxylicious.io/v1alpha1
  metadata:
    name: filter-allow-ingress-missing
    namespace: proxy-ns
  spec:
    defaultIngress: allow-all
    defaultEgress: deny-all
    kafkaProxy:
      proxyRef:
        name: my-proxy
      allowEgressToClusterDns: true
      allowIngressForMetrics: []
    kafkaProxyIngresses: []
    kafkaServices: []
    kafkaProtocolFilters:
      - filterRef:
          name: my-filter
        allowEgress: []
expectFailureMessageToContain: |-
  spec.kafkaProtocolFilters[0].allowIngress: Required value
